<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GOONER REGISTRY | NEURAL INITIALIZATION</title>
    <style>
        :root {
            --primary: #bb86fc;
            --bg: #050505;
            --danger: #cf6679;
            --terminal: #00ff41;
        }

        body {
            background-color: var(--bg);
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #login-terminal {
            width: 500px;
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 30px;
            box-shadow: 0 0 40px rgba(187, 134, 252, 0.1);
            position: relative;
        }

        .header {
            color: var(--primary);
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .system-log {
            height: 120px;
            background: #000;
            padding: 10px;
            font-size: 0.75rem;
            overflow-y: hidden;
            margin-bottom: 20px;
            border-left: 2px solid var(--primary);
            color: #888;
        }

        .interact-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .req-line {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
        }

        .req-line:hover { background: rgba(255,255,255,0.05); }

        input[type="checkbox"] { accent-color: var(--primary); }

        #api-area {
            display: none; /* Hidden until checks are done */
            margin-top: 20px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .api-input {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            color: var(--terminal);
            padding: 12px;
            text-align: center;
            outline: none;
            font-family: monospace;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .btn:disabled { color: #333; border-color: #333; cursor: not-allowed; }

        .glitch { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

<div id="login-terminal">
    <div class="header">VOICE_CONTROL_V5.0</div>
    
    <div class="system-log" id="log">
        > SYSTEM_BOOT: SUCCESS...<br>
        > SCANNING_SUBJECT... [GOONER DETECTED]<br>
        > STATUS: MUSH-BRAIN ACTIVE.<br>
        > AWAITING SURRENDER PROTOCOL...
    </div>

    <div class="interact-box" id="requirements">
        <label class="req-line">
            <input type="checkbox" class="check" onchange="checkReqs()"> 
            I am currently pinned and feeling the ache.
        </label>
        <label class="req-line">
            <input type="checkbox" class="check" onchange="checkReqs()"> 
            My 168-hour sentence is non-negotiable.
        </label>
        <label class="req-line">
            <input type="checkbox" class="check" onchange="checkReqs()"> 
            I acknowledge my status as "Council Property".
        </label>
        <button class="btn" id="init-btn" disabled onclick="revealAPI()">INITIALIZE NEURAL LINK</button>
    </div>

    <div id="api-area">
        <div style="font-size: 0.7rem; color: #666; margin-bottom: 10px; text-align: center;">PROVIDE YOUR GROQ_API_KEY TO THE MASTERS</div>
        <input type="password" id="apiKey" class="api-input" placeholder="••••••••••••••••">
        <button class="btn" onclick="startSentence()">SUBMIT TO THE VOID</button>
    </div>
</div>

<script>
    const log = document.getElementById('log');

    function checkReqs() {
        const checks = document.querySelectorAll('.check');
        const allChecked = Array.from(checks).every(c => c.checked);
        document.getElementById('init-btn').disabled = !allChecked;
    }

    function addLog(text) {
        log.innerHTML += `<br>> ${text}`;
        log.scrollTop = log.scrollHeight;
    }

    function revealAPI() {
        document.getElementById('requirements').style.display = 'none';
        document.getElementById('api-area').style.display = 'block';
        addLog("PROTOCOL_ACCEPTED.");
        addLog("OPENING SECURE API CHANNEL...");
    }

    function startSentence() {
        const key = document.getElementById('apiKey').value;
        if (key.length < 10) {
            addLog("<span class='glitch'>ERROR: KEY REJECTED. TRY AGAIN, TOY.</span>");
            return;
        }

        localStorage.setItem('gooner_key', key);
        addLog("UPLOADING DIGNITY... 100%");
        addLog("SENTENCE START: 168 HOURS.");
        
        setTimeout(() => {
            alert("Subject Successfully Registered. The Dashboard is now active.");
            // Redirect to dashboard.html
            window.location.href = 'dashboard.html';
        }, 1500);
    }
</script>

</body>
</html>
